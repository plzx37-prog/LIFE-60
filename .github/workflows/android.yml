
name: Build LIFE60 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LIFE60-android-project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip LIFE60-android-project.zip -d /tmp/life60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Build APK
        run: |
          cd /tmp/life60/LIFE60
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LIFE60-APK
          path: /tmp/life60/LIFE60/app/build/outputs/apk/debug/app-debug.apk
