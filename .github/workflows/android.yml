
name: Build LIFE60 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LIFE60-android-project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip LIFE60-android-project.zip -d /tmp/life60

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd /tmp/life60/LIFE60
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE60-APK
          path: /tmp/life60/LIFE60/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
